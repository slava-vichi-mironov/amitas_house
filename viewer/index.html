<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Amita's House — 3D</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0e1116; }
  #app { position: fixed; inset: 0; }
  .panel {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(15, 18, 24, 0.82); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    padding: 14px 16px; color: #e8ecf2; width: 250px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  .panel h1 { font-size: 15px; margin: 0 0 2px; font-weight: 650; letter-spacing: .2px; }
  .panel .sub { font-size: 11.5px; color: #93a0b4; margin-bottom: 12px; }
  .modes { display: flex; gap: 6px; margin-bottom: 12px; }
  .modes button {
    flex: 1; padding: 7px 0; border-radius: 9px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05); color: #cfd8e3; font-size: 12.5px; cursor: pointer;
    transition: all .15s;
  }
  .modes button.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .modes button:hover:not(.active) { background: rgba(255,255,255,0.12); }
  .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 0; color: #cfd8e3; }
  .row input { accent-color: #3b82f6; }
  .sep { height: 1px; background: rgba(255,255,255,0.08); margin: 10px 0; }
  .keys { font-size: 11px; color: #8e9bb0; line-height: 1.65; }
  .keys b { color: #c6d0dd; font-weight: 600; }
  #hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: rgba(15,18,24,0.85); color: #dfe6ef; font-size: 13px;
    padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    z-index: 10; display: none; pointer-events: none;
  }
  #crosshair {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 4px; height: 4px; background: rgba(255,255,255,0.9); border-radius: 50%;
    z-index: 9; display: none; pointer-events: none;
  }
  #level-ind {
    position: fixed; right: 16px; top: 16px; z-index: 10;
    background: rgba(15,18,24,0.82); border: 1px solid rgba(255,255,255,0.08);
    color: #dfe6ef; border-radius: 12px; padding: 10px 14px; font-size: 12.5px;
    display: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="panel">
  <h1>בית משפחת אימברמן</h1>
  <div class="sub">Permit 20230022 &middot; generated from the plans</div>
  <div class="modes">
    <button id="btn-orbit" class="active">Orbit</button>
    <button id="btn-walk">Walk inside</button>
  </div>
  <div class="row"><input type="checkbox" id="vis-ground" checked /><label for="vis-ground">Ground floor — living, mamad</label></div>
  <div class="row"><input type="checkbox" id="vis-first" checked /><label for="vis-first">First floor — bedrooms</label></div>
  <div class="row"><input type="checkbox" id="vis-stairroom" checked /><label for="vis-stairroom">Roof level — stair room</label></div>
  <div class="row"><input type="checkbox" id="vis-roofs" checked /><label for="vis-roofs">Roof slabs</label></div>
  <div class="sep"></div>
  <div class="keys" id="keys-orbit">
    <b>Drag</b> rotate &nbsp; <b>Scroll</b> zoom &nbsp; <b>Right-drag</b> pan<br/>
    Toggle floors to peek inside.
  </div>
  <div class="keys" id="keys-walk" style="display:none">
    <b>WASD</b> move &nbsp; <b>Mouse</b> look<br/>
    <b>E / Q</b> up &amp; down a level &nbsp; <b>Shift</b> run<br/>
    <b>Esc</b> release mouse
  </div>
</div>
<div id="level-ind"></div>
<div id="hint">Click to capture the mouse and walk</div>
<div id="crosshair"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
